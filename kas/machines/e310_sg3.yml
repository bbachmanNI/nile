header:
  version: 19
  includes:
    - kas/includes/base-config.yml
    - kas/includes/meta-ettus.yml
    - kas/includes/meta-mender.yml
    - kas/includes/meta-virtualization.yml
    - kas/includes/meta-security.yml
    - kas/includes/meta-sdr.yml
    - kas/includes/meta-qt5.yml

local_conf_header:
  ensure-tpm-feature: |
    DISTRO_FEATURES:append = " tpm"

  using-old-kernel: |
    OLDEST_KERNEL = "5.10"


  UHD image mirror: |
    UHD_BASE_URL = "http://orbitty.amer.corp.natinst.com:9090/binaries/cache/"

  SDK deploy directory: |
    SDK_DEPLOY:append = "/e310_sg3"

  no FEATURE_C12 in ext4 images: |
    EXTRA_IMAGECMD:ext4 = "-i 4096 -O ^orphan_file"
    MENDER_DATA_PART_FSOPTS = "-i 4096 -O ^orphan_file"

machine: ni-e31x-sg3-mender

env:
  DISTRO: nile
  MENDER_ARTIFACT_NAME: git_e310_sg3

repos:
  meta-ettus:
    layers:
      meta-ettus-bsp:
      meta-ettus-core:
      meta-e31x:
      meta-mender-e31x:

  meta-openembedded:
    layers:
      meta-oe:
      meta-filesystems:
      meta-networking:
      meta-python:
      meta-webserver:

  meta-mender:
    layers:
      meta-mender-core:
    patches:
      systemd-dont-set-source_date_epoch:
        repo: meta-ettus
        path: kas/patches/meta-mender/0002-systemd-don-t-set-SOURCE_DATE_EPOCH-to-0.patch

  meta-arm:
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-security:
    layers:
      meta-tpm:

  meta-virtualization:
    layers:
      .:

  meta-sdr:
    layers:
      .:

  meta-qt5:
    layers:
      .:
