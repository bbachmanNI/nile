name: Trigger AzDO PR pipeline

on:
  workflow_dispatch:
  pull_request_target:
    branches:
      - main

jobs:
  trigger-azdo-tests:
    runs-on: ubuntu-latest
    environment: ni-dev
    steps:
      - name: Set variables for PR run
        if: ${{ github.event_name == 'pull_request_target' }}
        run: |
          echo "BUILD_REF=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          echo "REPO_URL=${{ github.server_url }}/${{ github.event.pull_request.head.repo.full_name }}.git" >> $GITHUB_ENV
      - name: Set variables for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "BUILD_REF=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "REPO_URL=${{ github.server_url }}/${{ github.repository }}.git" >> $GITHUB_ENV
      - name: Queue Azure pipeline
        env:
          AZDO_PAT: ${{ secrets.AZDO_PIPELINE_TRIGGERS }}
        run: |
          set -euo pipefail
          : "${AZDO_PAT:?Missing AZDO_PIPELINE_TRIGGERS secret}"

          project_url="https://dev.azure.com/ni/DevCentral"
          pipeline_name="ni-central-rtos-nile-github"

          definition_id="$(
            curl --fail --silent --show-error \
              --user ":${AZDO_PAT}" \
              "${project_url}/_apis/build/definitions?name=${pipeline_name}&api-version=7.1" |
            jq -er --arg name "$pipeline_name" '
              [.value[] | select(.name == $name) | .id]
              | if length == 1 then .[0]
                else error("Expected exactly one matching pipeline")
                end
            '
          )"

          request_body="$(
            jq -n \
              --argjson definition_id "$definition_id" \
              --arg build_ref "$BUILD_REF" \
              --arg repo_url "$REPO_URL" \
              '{
                definition: {id: $definition_id},
                sourceBranch: "refs/heads/users/jhofrich/nile-x4xx-build",
                parameters: ({BUILD_REF: $build_ref, REPO_URL: $repo_url} | tojson)
              }'
          )"

          curl --fail --silent --show-error \
            --user ":${AZDO_PAT}" \
            --header "Content-Type: application/json" \
            --data "$request_body" \
            "${project_url}/_apis/build/builds?api-version=7.1"
